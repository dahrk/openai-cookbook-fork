name: Scheduled Issue Pilot
run-name: "Issue Pilot · issue #${{ github.event.issue.number || inputs.issue_number }} · GPT-6 Luna"
on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open issue authored by @dahrk in this fork
        type: number
        required: true
      disposition:
        description: Follow the issue form or explicitly choose an escape hatch
        type: choice
        options: [from_issue, implement, needs_human_review, wont_implement]
        default: from_issue
permissions:
  contents: read
concurrency:
  group: issue-pilot-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  triage:
    if: >-
      github.repository == 'dahrk/openai-cookbook-fork' &&
      github.actor == 'dahrk' &&
      (github.event_name == 'workflow_dispatch' || github.event.issue.user.login == 'dahrk')
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    defaults:
      run:
        working-directory: tools/issue-pilot
    env:
      PILOT_MODE: live
      STATE_BRANCH: issue-pilot-state-${{ github.event.issue.number || inputs.issue_number }}
      PILOT_BACKEND: codex
      OPENAI_MODEL: gpt-6-luna
      PILOT_SITE_URL: https://issue-pilot-loop-observatory.awaresun14.chatgpt.site
      PILOT_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      PILOT_REQUIRE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate owner-authored issue before loading secrets
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          DISPOSITION: ${{ inputs.disposition || 'from_issue' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          python - <<'PYTHON'
          import os
          from pilot import GitHub, authorized_issue, issue_outcome
          issue = authorized_issue(GitHub(os.environ['TARGET_REPO']), int(os.environ['ISSUE_NUMBER']))
          outcome = os.environ['DISPOSITION']
          if outcome == 'from_issue':
              outcome = issue_outcome(issue)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('outcome=' + outcome + '\n')
          print('Authorized issue #' + str(issue['number']) + ' by @dahrk; outcome ' + outcome)
          PYTHON
      - name: Install socket transport
        run: pip install -r requirements-telemetry.txt
      - uses: actions/setup-node@v4
        if: steps.authorize.outputs.outcome == 'implement'
        with:
          node-version: '22'
      - name: Install pinned Codex CLI
        if: steps.authorize.outputs.outcome == 'implement'
        run: npm install -g @openai/codex@0.166.0 --ignore-scripts
      - name: Verify worker policies
        run: python -m unittest discover -s tests -v
      - name: Check connection prerequisites
        env:
          REQUIRE_MODEL: ${{ steps.authorize.outputs.outcome == 'implement' }}
          API_KEY: ${{ steps.authorize.outputs.outcome == 'implement' && secrets.OPENAI_API_KEY || '' }}
          SITE_BEARER: ${{ secrets.PILOT_SITE_BEARER }}
        run: |
          test -n "$SITE_BEARER" || { echo 'Missing PILOT_SITE_BEARER Actions secret'; exit 1; }
          if [ "$REQUIRE_MODEL" = true ]; then
            test -n "$API_KEY" || { echo 'Missing OPENAI_API_KEY Actions secret'; exit 1; }
          fi
      - name: Restore persistent state
        if: env.PILOT_MODE == 'live'
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH"; then
            git fetch origin "$STATE_BRANCH"
            git show FETCH_HEAD:state.json > state/state.json
          else
            result=$?
            if [ "$result" -ne 2 ]; then exit "$result"; fi
          fi
      - name: Run intake and fixes with GPT-6 Luna only
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ steps.authorize.outputs.outcome == 'implement' && secrets.OPENAI_API_KEY || '' }}
          PILOT_SITE_BEARER: ${{ secrets.PILOT_SITE_BEARER }}
          TARGET_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          DISPOSITION: ${{ inputs.disposition || 'from_issue' }}
        run: |
          python pilot.py live --repo "$TARGET_REPO" --issue-number "$ISSUE_NUMBER" --disposition "$DISPOSITION" --max-fixes 1
      - name: Save state even after partial failure
        if: always() && env.PILOT_MODE == 'live'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f state/state.json ]; then exit 0; fi
          git config user.name 'issue-pilot[bot]'
          git config user.email 'issue-pilot@users.noreply.github.com'
          state_blob=$(git hash-object -w state/state.json)
          state_tree=$(printf '100644 blob %s\tstate.json\n' "$state_blob" | git mktree)
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH"; then
            git fetch origin "$STATE_BRANCH"
            parent=$(git rev-parse FETCH_HEAD)
            commit=$(printf 'Persist issue groups and fix history\n' | git commit-tree "$state_tree" -p "$parent")
          else
            commit=$(printf 'Persist issue groups and fix history\n' | git commit-tree "$state_tree")
          fi
          git -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push origin "$commit:refs/heads/$STATE_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-pilot-report
          retention-days: 3
          path: tools/issue-pilot/artifacts/
