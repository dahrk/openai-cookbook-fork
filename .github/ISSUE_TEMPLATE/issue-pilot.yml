name: Issue Pilot
description: Route a report through Issue Pilot (automation runs only for @dahrk).
title: "[Issue Pilot] "
body:
  - type: markdown
    attributes:
      value: |
        Only issues created by @dahrk can run this workflow. Other authors cannot consume its secrets.
        Implement uses GPT-6 Luna and can open a draft README fix. Human review keeps the issue open.
        Review checks one README-only PR and publishes advisory findings before returning to a person.
        Won't implement closes this issue as not planned. No choice automatically merges a PR.
  - type: dropdown
    id: outcome
    attributes:
      label: Pilot outcome
      options:
        - Implement with GPT-6 Luna
        - Review a pull request with GPT-6 Luna
        - Needs human review
        - Won't implement (close as not planned)
      default: 2
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report and desired change
      description: Describe the evidence, expected behavior, and requested documentation change.
    validations:
      required: true
  - type: input
    id: review_pr
    attributes:
      label: Pull request number
      description: Required only for Review. An open README-only PR in this fork, for example 5.
  - type: input
    id: review_focus
    attributes:
      label: Review focus
      description: Required checks for the review agent (at most 1200 characters).
  - type: dropdown
    id: backend
    attributes:
      label: Execution backend
      description: Codex CLI uses GitHub Actions compute. Agents API uses the managed Codex harness; Actions still dispatches and applies the result.
      options:
        - Codex CLI (GitHub Actions)
        - Agents API (managed Codex)
      default: 0
    validations:
      required: true
